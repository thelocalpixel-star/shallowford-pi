<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Takeover Screen</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
  }

  .screen {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #000;
  }

  .image-area {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
    isolation: isolate;
  }

  /* Fill the wide TV naturally without stretching or cropping the portrait. */
  .image-area::before {
    content: "";
    position: absolute;
    inset: -6%;
    z-index: -2;
    background: url("takeover.png") center center / cover no-repeat;
    filter: blur(34px) saturate(0.9) brightness(0.52);
    transform: scale(1.08);
  }

  .image-area::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(90deg, rgba(0, 0, 0, 0.42), transparent 28%, transparent 72%, rgba(0, 0, 0, 0.42)),
      linear-gradient(180deg, rgba(0, 0, 0, 0.12), transparent 18%, transparent 82%, rgba(0, 0, 0, 0.2));
  }

  .takeover-image {
    display: block;
    width: auto;
    height: 100%;
    max-width: 100%;
    object-fit: contain;
    background: #000;
    box-shadow: 0 0 52px rgba(0, 0, 0, 0.72);
  }

</style>
</head>
<body>
<div class="screen">
  <main class="image-area">
    <img class="takeover-image" src="takeover.png" alt="Takeover announcement">
  </main>
</div>

<script>
  // Keep the existing local watchdog heartbeat format compatible with this
  // still-image version of the signage page.
  const updateHeartbeat = () => {
    document.title = `Signage heartbeat ${Math.floor(Date.now() / 1000)} playing`;
  };
  updateHeartbeat();
  setInterval(updateHeartbeat, 10000);
</script>
</body>
</html>
